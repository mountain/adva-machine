[package]
name = "adva-checked-roundtrip-reuse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "../../LICENSE"
# Independent research package: the parent Cargo/crates boundary stays frozen.

[workspace]

[dependencies]
adva-ir = { path = "../../crates/adva-ir" }
adva-lisp = { path = "../../crates/adva-lisp" }
adva-witness = { path = "../../crates/adva-witness" }
blake3 = "=1.8.7"
num-bigint = "=0.4.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

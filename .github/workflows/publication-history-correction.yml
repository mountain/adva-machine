name: Publication history correction
on:
  push:
    branches: [main]
    paths: [governance/withdrawals/run-history-correction.json]
permissions:
  contents: write
concurrency:
  group: publication-history-correction
  cancel-in-progress: false
jobs:
  correct:
    if: >-
      github.repository == 'mountain/adva-machine' && contains(github.event.head_commit.message, 'Publication-Cleanup-Run: 20260916')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: newren/git-filter-repo
          ref: d7b75aca907380f608892cc289e616f195427b99
          path: filter-tool
          persist-credentials: false
      - name: Use the repository workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Verify every changed commit before atomic publication
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: >-
          python3 source/scripts/withdraw_publication_history.py
          --source "https://github.com/mountain/adva-machine.git"
          --repository adva-machine
          --manifest source/governance/withdrawals/known-withdrawn-content.json
          --filter-tool filter-tool/git-filter-repo
          --guard source/scripts/check_publication_boundary.py
          --workspace "$RUNNER_TEMP/publication-correction"
          --expected-main "$GITHUB_SHA"
          --publish --library-map source/governance/withdrawals/library-history-map-2026-09-16.json

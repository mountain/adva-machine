name: Publication boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  withdrawn-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_publication_boundary.py --history
